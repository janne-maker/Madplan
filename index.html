<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min Opskriftsbog</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf7f2;
    --warm: #f0ebe1;
    --brown: #3d2b1f;
    --brown-mid: #7a5c4a;
    --brown-light: #c4a882;
    --green: #4a6741;
    --green-light: #e8f0e7;
    --accent: #c9543a;
    --text: #2a1f17;
    --text-soft: #7a6a5a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--brown);
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--cream);
    letter-spacing: 0.5px;
  }

  header p {
    font-size: 12px;
    color: var(--brown-light);
    margin-top: 2px;
  }

  .search-bar {
    padding: 12px 16px;
    background: var(--warm);
    border-bottom: 1px solid #e0d8cc;
  }

  .search-bar input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 24px;
    border: 1.5px solid #d8cfc4;
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }

  .search-bar input:focus { border-color: var(--brown-mid); }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--warm);
    border-bottom: 1px solid #e0d8cc;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    border: 1.5px solid #d8cfc4;
    background: white;
    color: var(--text-soft);
    transition: all 0.2s;
  }

  .tab.active {
    background: var(--brown);
    color: var(--cream);
    border-color: var(--brown);
  }

  .recipe-list {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .recipe-card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    border: 1.5px solid #ede7dc;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .recipe-card:hover {
    border-color: var(--brown-mid);
    box-shadow: 0 4px 16px rgba(61,43,31,0.1);
  }

  .recipe-emoji {
    font-size: 32px;
    width: 52px;
    height: 52px;
    background: var(--green-light);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .recipe-info { flex: 1; }

  .recipe-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--brown);
    line-height: 1.3;
  }

  .recipe-meta {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 4px;
  }

  .recipe-tag {
    display: inline-block;
    background: var(--green-light);
    color: var(--green);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 6px;
  }

  .recipe-arrow { color: var(--brown-light); font-size: 18px; }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-soft);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

  .empty-state h3 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--brown);
    margin-bottom: 8px;
  }

  .empty-state p { font-size: 14px; line-height: 1.6; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42,31,23,0.5);
    z-index: 200;
    display: none;
    align-items: flex-end;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--cream);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: #d8cfc4;
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .modal-header {
    padding: 16px 20px 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .modal-emoji {
    font-size: 40px;
    width: 64px;
    height: 64px;
    background: var(--green-light);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .modal-title { flex: 1; }

  .modal-title h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--brown);
    line-height: 1.3;
  }

  .modal-title p {
    font-size: 13px;
    color: var(--text-soft);
    margin-top: 4px;
  }

  .modal-close {
    background: var(--warm);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    color: var(--text-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-body { padding: 0 20px 32px; }

  .section-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--brown-light);
    margin: 20px 0 10px;
  }

  .ingredients-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ingredient-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: white;
    border-radius: 10px;
    border: 1px solid #ede7dc;
    font-size: 14px;
  }

  .ingredient-name { color: var(--text); }
  .ingredient-amount { color: var(--text-soft); font-size: 13px; }

  .steps-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .step-number {
    width: 28px;
    height: 28px;
    background: var(--brown);
    color: var(--cream);
    border-radius: 50%;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .step-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    flex: 1;
    padding-top: 4px;
  }

  .loading {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-soft);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>📖 Min Opskriftsbog</h1>
  <p id="recipe-count">Henter opskrifter...</p>
</header>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="🔍 Søg efter opskrift..." oninput="renderRecipes()">
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tag="alle" onclick="filterByTag('alle', this)">Alle</div>
  <div class="tab" data-tag="aftensmad" onclick="filterByTag('aftensmad', this)">Aftensmad</div>
  <div class="tab" data-tag="frokost" onclick="filterByTag('frokost', this)">Frokost</div>
  <div class="tab" data-tag="vegetar" onclick="filterByTag('vegetar', this)">Vegetar</div>
  <div class="tab" data-tag="pasta" onclick="filterByTag('pasta', this)">Pasta</div>
  <div class="tab" data-tag="suppe" onclick="filterByTag('suppe', this)">Suppe</div>
</div>

<div class="recipe-list" id="recipe-list">
  <div class="loading">⏳ Henter opskrifter...</div>
</div>

<!-- RECIPE DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-emoji" id="detail-emoji"></div>
      <div class="modal-title">
        <h2 id="detail-name"></h2>
        <p id="detail-meta"></p>
      </div>
      <button class="modal-close" onclick="closeDetailModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="section-title">Ingredienser</div>
      <div class="ingredients-grid" id="detail-ingredients"></div>
      <div class="section-title">Fremgangsmåde</div>
      <div class="steps-list" id="detail-steps"></div>
    </div>
  </div>
</div>

<script>
  let recipes = [];
  let selectedTags = new Set();

  async function loadRecipes() {
    try {
      const res = await fetch('recipes.json?v=' + Date.now());
      recipes = await res.json();
    } catch(e) {
      recipes = [];
    }
    renderRecipes();
  }

  function renderRecipes() {
    const list = document.getElementById('recipe-list');
    const search = document.getElementById('search-input').value.toLowerCase();

    const filtered = recipes.filter(r => {
      const matchTag = selectedTags.size === 0 || selectedTags.has(r.tag);
      const matchSearch = r.name.toLowerCase().includes(search);
      return matchTag && matchSearch;
    });

    const count = document.getElementById('recipe-count');
    count.textContent = recipes.length === 0
      ? 'Ingen opskrifter endnu'
      : `${recipes.length} opskrift${recipes.length !== 1 ? 'er' : ''}`;

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🍽️</div>
          <h3>${recipes.length === 0 ? 'Opskriftsbogen er tom' : 'Ingen resultater'}</h3>
          <p>${recipes.length === 0 ? 'Nye opskrifter tilføjes hver uge' : 'Prøv en anden søgning eller kategori'}</p>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map((r) => `
      <div class="recipe-card" onclick="openDetailModal(${recipes.indexOf(r)})">
        <div class="recipe-emoji">${r.emoji || '🍴'}</div>
        <div class="recipe-info">
          <div class="recipe-name">${r.name}</div>
          ${r.meta ? `<div class="recipe-meta">${r.meta}</div>` : ''}
          <span class="recipe-tag">${r.tag}</span>
        </div>
        <div class="recipe-arrow">›</div>
      </div>
    `).join('');
  }

  function filterByTag(tag, el) {
    if (tag === 'alle') {
      selectedTags.clear();
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    } else {
      document.querySelector('.tab[data-tag="alle"]').classList.remove('active');
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
        el.classList.remove('active');
      } else {
        selectedTags.add(tag);
        el.classList.add('active');
      }
      if (selectedTags.size === 0) {
        document.querySelector('.tab[data-tag="alle"]').classList.add('active');
      }
    }
    renderRecipes();
  }

  function openDetailModal(index) {
    const r = recipes[index];
    document.getElementById('detail-emoji').textContent = r.emoji || '🍴';
    document.getElementById('detail-name').textContent = r.name;
    document.getElementById('detail-meta').textContent = r.meta || '';

    const ingDiv = document.getElementById('detail-ingredients');
    ingDiv.innerHTML = r.ingredients.map(ing => {
      const parts = ing.split('–');
      if (parts.length === 2) {
        return `<div class="ingredient-row">
          <span class="ingredient-name">${parts[0].trim()}</span>
          <span class="ingredient-amount">${parts[1].trim()}</span>
        </div>`;
      }
      return `<div class="ingredient-row"><span class="ingredient-name">${ing}</span></div>`;
    }).join('');

    const stepsDiv = document.getElementById('detail-steps');
    stepsDiv.innerHTML = r.steps.map((step, i) => `
      <div class="step">
        <div class="step-number">${i+1}</div>
        <div class="step-text">${step}</div>
      </div>
    `).join('');

    document.getElementById('detail-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDetailModal() {
    document.getElementById('detail-modal').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('detail-modal').addEventListener('click', function(e) {
    if (e.target === this) closeDetailModal();
  });

  loadRecipes();
</script>
</body>
</html>
